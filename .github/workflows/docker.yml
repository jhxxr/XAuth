name: Docker image

# Publishes ghcr.io/<owner>/<repo> on version tags and on main.
# Pull requests build without pushing, so a broken Dockerfile fails the PR.
# Set MAIN_BRANCH below if the repository's default branch is not "main".
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "go.mod"
      - "go.sum"
      - "web/**"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test and build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '^internal/webui/dist/' || true)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build web
        working-directory: web
        run: |
          npm run typecheck
          npm run build

      - name: go vet and tests
        run: |
          go vet ./...
          go test ./...

  image:
    name: Build, smoke-test and push image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # One native build is enough to prove the image starts; the published
      # multi-arch image is built below with the same Dockerfile.
      - name: Smoke test image
        run: |
          set -euo pipefail
          trap 'docker rm -f xauth-smoke >/dev/null 2>&1 || true' EXIT

          docker build --tag xauth:smoke .
          # No volume here: this checks that the image's own /data works for
          # the non-root user, which is what a fresh deployment needs.
          docker run -d --name xauth-smoke -p 18080:8080 \
            -e XAUTH_ISSUER=http://localhost:18080 -e XAUTH_DEV=true xauth:smoke

          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:18080/healthz >/dev/null; then ok=1; break; fi
            sleep 1
          done
          docker logs xauth-smoke
          test -n "$ok"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # A version tag publishes 1.2.3, 1.2 and 1; "latest" stays on edge.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Every main build also moves :edge. Non-main branches and PRs
            # only get a short SHA tag, which is never pushed from a PR.
            type=edge,branch=main
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=XAuth
            org.opencontainers.image.description=Lightweight self-hosted OpenID Connect provider
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Release notes get the exact digest so a rollback pins an immutable image.
      - name: Summary
        run: |
          echo "### XAuth image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
